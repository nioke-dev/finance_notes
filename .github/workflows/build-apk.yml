name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          cd mobile
          flutter create . --org com.driverfinance.malang --platforms=android --project-name driver_finance_mobile
          
          # Add permissions for microphone audio recording and GPS geolocation
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

          # Set minSdkVersion to 23 required by record_android
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true
          grep -i "minSdk" android/app/build.gradle || true

          # Set Kotlin version to 1.9.24 to match compiled library dependencies
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle || true
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/g" android/build.gradle || true
          sed -i "s/kotlin_version = .*/kotlin_version = '1.9.24'/g" android/build.gradle || true
          grep -i "kotlin" android/settings.gradle || true
          grep -i "kotlin" android/build.gradle || true

      - name: Get Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release APK
        id: build_apk
        run: |
          cd mobile
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee ../build.log

      - name: Sync Build Log to Server Bridge
        if: always()
        run: |
          curl -s -X POST https://financenotes.nurulmustofa.my.id/api/v1/ci/log --data-binary @build.log || true

      - name: Find & Prepare APK
        run: |
          mkdir -p releases
          APK_PATH=$(find mobile/build -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" releases/driver-finance-latest.apk
          ls -lh releases/driver-finance-latest.apk

      - name: Deploy APK Directly to Production Server
        run: |
          echo "Uploading release APK to production server..."
          curl -s -X POST https://financenotes.nurulmustofa.my.id/api/v1/ci/upload-apk --data-binary @releases/driver-finance-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-finance-apk
          path: releases/driver-finance-latest.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-release
          name: "Driver Finance Android APK v1.1.0"
          body: |
            ## Driver Finance Malang - Release v1.1.0
            - 🎙️ Intercom Voice Memo Helm dengan GPS Geolocation
            - 🧮 Multi-COD Resto Calculator 3-digit
            - 🎯 Misi Bebas Hutang 31 Oktober & Cicilan Jatuh Tempo
            - ☕ Kebutuhan Sehari-Hari & Safe-to-Spend
            - 📲 Mobile Bottom Navigation OLED-Friendly
          files: releases/driver-finance-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
