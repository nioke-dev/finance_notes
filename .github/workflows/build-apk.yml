name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform scaffold & AndroidX
        run: |
          cd mobile
          flutter create . --org com.driverfinance.malang --platforms=android

      - name: Get Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Rename & Prepare APK
        run: |
          mkdir -p releases
          cp mobile/build/app/outputs/flutter-apk/app-release.apk releases/driver-finance-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-finance-apk
          path: releases/driver-finance-latest.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-release
          name: "Driver Finance Android APK v1.1.0"
          body: |
            ## Driver Finance Malang - Release v1.1.0
            - 🎙️ Intercom Voice Memo Helm dengan GPS Geolocation
            - 🧮 Multi-COD Resto Calculator 3-digit
            - 🎯 Misi Bebas Hutang 31 Oktober & Cicilan Jatuh Tempo
            - ☕ Kebutuhan Sehari-Hari & Safe-to-Spend
            - 📲 Mobile Bottom Navigation OLED-Friendly
          files: releases/driver-finance-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
